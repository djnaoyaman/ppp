name: Author profile browser checks
on:
  pull_request:
    paths: ['**.html', 'styles.css', 'sitemap.xml', 'assets/brand/**', 'og/**', 'scripts/**', 'tests/brand*', '404.html', 'tests/crawl-metadata.py', 'profile.html', 'about.html', 'index.html', 'style.css', 'script.js', 'tests/profile-browser.cjs', '.github/workflows/profile-checks.yml']
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tests/crawl-metadata.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/profile-http.log 2>&1 &
          python3 scripts/build_og_cards.py
          node scripts/render-og-cards.cjs
          python3 tests/brand-static.py
          node tests/brand-browser.cjs
          node tests/profile-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: author-profile-screenshots
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 7
